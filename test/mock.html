<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><title>mock</title></head>
<body>
  <!-- x.com/home のタブ列を模したもの。MLB が選択された状態で開く -->
  <div role="tablist">
    <div role="presentation"><a role="tab" aria-selected="false" href="#">おすすめ</a></div>
    <div role="presentation"><a role="tab" aria-selected="false" href="#">フォロー中</a></div>
    <div role="presentation"><a role="tab" aria-selected="true" href="#">MLB</a></div>
  </div>
  <p id="selected"></p>
  <script>
    // クリックで選択を切り替える（X の挙動の代わり）
    document.querySelectorAll('[role="tab"]').forEach((t) =>
      t.addEventListener("click", (e) => {
        e.preventDefault();
        document.querySelectorAll('[role="tab"]').forEach((x) => x.setAttribute("aria-selected", "false"));
        t.setAttribute("aria-selected", "true");
        document.getElementById("selected").textContent = "選択中: " + t.textContent;
      })
    );
  </script>
  <script src="../content.js"></script>
</body>
</html>
